<script>

/* =========================================================

if(!firebase.apps.length){

    firebase.initializeApp(
        firebaseConfig
    );

const db =

/* =========================================================
   URL PARAMETERS
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const postId =
    params.get("id");


/*
 * Admin এখন এভাবে পাঠাবে:
 *
 * player.html?id=ABC&collection=newVideos
 *
 * অথবা
 *
 * player.html?id=ABC&collection=profiles
 */


let collection =
    params.get("collection");


/*
 * নিরাপত্তার জন্য শুধু এই দুই collection
 * গ্রহণ করা হবে।
 */

if(
    collection !== "profiles" &&
    collection !== "newVideos"
){

    collection = "newVideos";

}


let currentVideoUrl = "";

let currentVideoTitle = "";



/* =========================================================
   YOUTUBE ID
========================================================= */

function getYouTubeId(url){

    if(!url){
        return null;
    }


    try{

        const u =
            new URL(url);


        if(
            u.hostname.includes("youtu.be")
        ){

            return u.pathname
                .split("/")
                .filter(Boolean)[0] || null;

        }


        if(
            u.hostname.includes("youtube.com")
        ){

            const v =
                u.searchParams.get("v");


            if(v){
                return v;
            }


            const parts =
                u.pathname
                .split("/")
                .filter(Boolean);


            const index =
                parts.findIndex(
                    function(x){

                        return (
                            x === "embed" ||
                            x === "shorts" ||
                            x === "live"
                        );

                    }
                );


            if(
                index !== -1 &&
                parts[index + 1]
            ){

                return parts[index + 1];

            }

        }

    }catch(error){

        console.log(
            "YouTube URL error:",
            error
        );

    }


    return null;

}



/* =========================================================
   GOOGLE DRIVE ID
========================================================= */

function getDriveId(url){

    if(!url){
        return null;
    }


    try{

        const match =
            url.match(
                /\/file\/d\/([^\/?#]+)/
            );


        if(match){

            return match[1];

        }


        const u =
            new URL(url);


        return (
            u.searchParams.get("id") ||
            null
        );

    }catch(error){

        return null;

    }

}



/* =========================================================
   DATE
========================================================= */

function formatDate(timestamp){

    if(!timestamp){

        return "—";

    }


    try{

        if(
            typeof timestamp.toDate ===
            "function"
        ){

            return timestamp
                .toDate()
                .toLocaleDateString(
                    "bn-BD",
                    {
                        year:"numeric",
                        month:"long",
                        day:"numeric"
                    }
                );

        }


        return new Date(timestamp)
            .toLocaleDateString(
                "bn-BD",
                {
                    year:"numeric",
                    month:"long",
                    day:"numeric"
                }
            );

    }catch(error){

        return "—";

    }

}



/* =========================================================
   TIMESTAMP
========================================================= */

function getMillis(timestamp){

    if(!timestamp){

        return 0;

    }


    try{

        if(
            typeof timestamp.toMillis ===
            "function"
        ){

            return timestamp.toMillis();

        }


        if(
            typeof timestamp.toDate ===
            "function"
        ){

            return timestamp
                .toDate()
                .getTime();

        }


        if(
            typeof timestamp === "number"
        ){

            return timestamp;

        }


        if(
            typeof timestamp === "string"
        ){

            const value =
                new Date(timestamp)
                    .getTime();


            return isNaN(value)
                ? 0
                : value;

        }

    }catch(error){}


    return 0;

}



/* =========================================================
   SHOW ERROR
========================================================= */

function showError(
    message,
    externalUrl = null
){

    document.getElementById(
        "loading"
    ).style.display = "none";


    const errorBox =
        document.getElementById(
            "errorBox"
        );


    errorBox.style.display =
        "flex";


    document.getElementById(
        "errorText"
    ).textContent =
        message;


    if(externalUrl){

        const link =
            document.getElementById(
                "externalLink"
            );


        link.href =
            externalUrl;


        link.style.display =
            "inline-block";

    }

}



/* =========================================================
   HIDE LOADING
========================================================= */

function hideLoading(){

    document.getElementById(
        "loading"
    ).style.display =
        "none";

}



/* =========================================================
   PLAY VIDEO
========================================================= */

function playVideo(
    url,
    videoType = ""
){

    if(!url){

        showError(
            "ভিডিও লিংক পাওয়া যায়নি।"
        );

        return;

    }


    const playerBox =
        document.getElementById(
            "playerBox"
        );


    const youtubeId =
        getYouTubeId(url);


    /* =====================================================
       YOUTUBE
    ===================================================== */

    if(youtubeId){

        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.src =
            "https://www.youtube.com/embed/" +
            encodeURIComponent(youtubeId) +
            "?autoplay=0" +
            "&controls=1" +
            "&rel=0" +
            "&playsinline=1";


        iframe.setAttribute(
            "allow",
            "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        );


        iframe.setAttribute(
            "allowfullscreen",
            "true"
        );


        iframe.setAttribute(
            "referrerpolicy",
            "strict-origin-when-cross-origin"
        );


        playerBox.appendChild(
            iframe
        );


        hideLoading();

        return;

    }



    /* =====================================================
       GOOGLE DRIVE
    ===================================================== */

    const driveId =
        getDriveId(url);


    if(
        driveId ||
        videoType === "google_drive" ||
        videoType === "google-drive"
    ){

        if(!driveId){

            showError(
                "",
                url
            );

            return;

        }


        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.src =
            "https://drive.google.com/file/d/" +
            encodeURIComponent(driveId) +
            "/preview";


        iframe.setAttribute(
            "allow",
            "autoplay; fullscreen"
        );


        iframe.setAttribute(
            "allowfullscreen",
            "true"
        );


        playerBox.appendChild(
            iframe
        );


        hideLoading();

        return;

    }



    /* =====================================================
       DIRECT VIDEO
    ===================================================== */

    if(
        /\.(mp4|webm|ogg|m4v)(\?.*)?$/i
        .test(url)
    ){

        const video =
            document.createElement(
                "video"
            );


        video.src =
            url;


        video.controls =
            true;


        video.playsInline =
            true;


        video.preload =
            "metadata";


        video.addEventListener(
            "error",
            function(){

                showError(
                    "",
                    url
                );

            }
        );


        playerBox.appendChild(
            video
        );


        hideLoading();

        return;

    }



    /* =====================================================
       TELEGRAM
       
       Telegram-এর অনেক post URL iframe-এর ভিতরে
       চালানোর অনুমতি দেয় না।
       
       তাই Telegram হলে external open button দেখানো হবে।
    ===================================================== */

    if(
        videoType === "telegram" ||
        url.includes("t.me/")
    ){

        showError(
            "",
            url
        );

        return;

    }



    /* =====================================================
       BLOGGER / IFRAME / EMBEDDED
    ===================================================== */

    if(
        videoType === "blogger" ||
        videoType === "iframe" ||
        videoType === "embedded" ||
        videoType === ""
    ){

        const iframe =
            document.createElement(
                "iframe"
            );


        iframe.src =
            url;


        iframe.setAttribute(
            "allow",
            "autoplay; fullscreen; picture-in-picture"
        );


        iframe.setAttribute(
            "allowfullscreen",
            "true"
        );


        iframe.setAttribute(
            "referrerpolicy",
            "strict-origin-when-cross-origin"
        );


        playerBox.appendChild(
            iframe
        );


        hideLoading();

        return;

    }



    /* =====================================================
       FINAL FALLBACK
    ===================================================== */

    const iframe =
        document.createElement(
            "iframe"
        );


    iframe.src =
        url;


    iframe.setAttribute(
        "allow",
        "autoplay; fullscreen; picture-in-picture"
    );


    iframe.setAttribute(
        "allowfullscreen",
        "true"
    );


    iframe.setAttribute(
        "referrerpolicy",
        "strict-origin-when-cross-origin"
    );


    playerBox.appendChild(
        iframe
    );


    hideLoading();

}



/* =========================================================
   INCREASE VIEWS
========================================================= */

async function increaseViews(
    id,
    targetCollection
){

    try{

        const ref =
            db
            .collection(targetCollection)
            .doc(id);


        const snapshot =
            await ref.get();


        if(!snapshot.exists){

            return;

        }


        const data =
            snapshot.data();


        let views =
            Number(data.views);


        if(
            !Number.isFinite(views) ||
            views < 0
        ){

            views = 0;

        }


        const newViews =
            views + 1;


        await ref.update({

            views:newViews,

            updatedAt:
                firebase.firestore
                .FieldValue
                .serverTimestamp()

        });


        document.getElementById(
            "views"
        ).textContent =
            newViews.toLocaleString(
                "bn-BD"
            );


    }catch(error){

        /*
         Views update ব্যর্থ হলেও
         ভিডিও বন্ধ হবে না।
        */

        console.log(
            "Views update error:",
            error
        );

    }

}



/* =========================================================
   LOAD CURRENT VIDEO
========================================================= */

async function loadVideo(){

    if(!postId){

        showError(
            ""
        );

        return;

    }


    try{

        console.log(
            "Loading:",
            collection,
            postId
        );


        const ref =
            db
            .collection(collection)
            .doc(postId);


        const snapshot =
            await ref.get();


        if(!snapshot.exists){

            showError(
                "এই ভিডিওটি পাওয়া যায়নি।"
            );

            return;

        }


        const data =
            snapshot.data();


        /*
         * শুধুমাত্র Published ভিডিও Player-এ
         * দেখানো হবে।
         */

        if(
            data.status &&
            data.status !== "published"
        ){

            showError(
                ""
            );

            return;

        }


        currentVideoUrl =
            data.videoUrl || "";


        currentVideoTitle =
            data.title ||
            "Rater Tara Video";


        /* TITLE */

        document.getElementById(
            "videoTitle"
        ).textContent =
            currentVideoTitle;


        /* VIEWS */

        let views =
            Number(data.views);


        if(
            !Number.isFinite(views) ||
            views < 0
        ){

            views = 0;

        }


        document.getElementById(
            "views"
        ).textContent =
            views.toLocaleString(
                "bn-BD"
            );


        /* DATE */

        document.getElementById(
            "date"
        ).textContent =
            formatDate(
                data.createdAt
            );


        /* DESCRIPTION */

        if(data.description){

            document.getElementById(
                "description"
            ).textContent =
                data.description;


            document.getElementById(
                "descriptionBox"
            ).style.display =
                "block";

        }


        /* PLAY */

        playVideo(
            currentVideoUrl,
            data.videoType || ""
        );


        /*
         * View count
         * একই collection-এ update হবে।
         */

        increaseViews(
            postId,
            collection
        );


        /*
         * More videos
         */

        loadMoreVideos(
            postId
        );


    }catch(error){

        console.error(
            "LOAD VIDEO ERROR:",
            error
        );


        showError(
            "ভিডিও লোড করতে সমস্যা হয়েছে।"
        );

    }

}



/* =========================================================
   LOAD MORE VIDEOS
   BOTH COLLECTIONS
========================================================= */

async function loadMoreVideos(
    currentId

    const container =
        document.getElementById(
            "moreVideos"
        );


    try{

        const results =
            await Promise.all([

                db.collection("profiles")
                  .where(
                      "status",
                      "==",
                      "published"
                  )
                  .get(),

                db.collection("newVideos")
                  .where(
                      "status",
                      "==",
                      "published"
                  )
                  .get()

            ]);


        let videos = [];


        /* OLD */

        results[0].forEach(
            function(doc){

                if(
                    doc.id === currentId &&
                    collection === "profiles"
                ){

                    return;

                }


                videos.push({

                    id:doc.id,

                    collection:"profiles",

                    ...doc.data()

                });

            }
        );


        /* NEW */

        results[1].forEach(
            function(doc){

                if(
                    doc.id === currentId &&
                    collection === "newVideos"
                ){

                    return;

                }


                videos.push({

                    id:doc.id,

                    collection:"newVideos",

                    ...doc.data()

                });

            }
        );


        /* SORT */

        videos.sort(
            function(a,b){

                return (
                    getMillis(b.createdAt) -
                    getMillis(a.createdAt)
                );

            }
        );


        /* LIMIT */

        videos =
            videos.slice(0,20);


        container.innerHTML =
            "";


        document.getElementById(
            "videoCount"
        ).textContent =
            videos.length
            ? videos.length + " টি"
            : "";


        if(!videos.length){

            document.getElementById(
                "emptyVideos"
            ).style.display =
                "block";

            return;

        }


        document.getElementById(
            "emptyVideos"
        ).style.display =
            "none";


        videos.forEach(
            function(video){

                container.appendChild(
                    createVideoCard(
                        video
                    )
                );

            }
        );


    }catch(error){

        console.error(
            "MORE VIDEOS ERROR:",
            error
        );


        container.innerHTML =
            "";


        document.getElementById(
            "emptyVideos"
        ).style.display =
            "block";

    }

}



/* =========================================================
   CREATE VIDEO CARD
========================================================= */

function createVideoCard(
    video
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "video-card";


    /* THUMB */

    const thumb =
        document.createElement(
            "div"
        );


    thumb.className =
        "thumb";


    let imageUrl =
        video.img ||
        video.thumbnail ||
        video.image ||
        "";


    /*
     YouTube thumbnail
     */

    const youtubeId =
        getYouTubeId(
            video.videoUrl || ""
        );


    if(
        !imageUrl &&
        youtubeId
    ){

        imageUrl =
            "https://img.youtube.com/vi/" +
            youtubeId +
            "/hqdefault.jpg";

    }


    if(imageUrl){

        const img =
            document.createElement(
                "img"
            );


        img.src =
            imageUrl;


        img.alt =
            video.title ||
            "Video";


        img.loading =
            "lazy";


        img.onerror =
            function(){

                this.style.display =
                    "none";

            };


        thumb.appendChild(
            img
        );

    }


    /* PLAY ICON */

    const play =
        document.createElement(
            "div"
        );


    play.className =
        "play-icon";


    play.innerHTML =
        '<i class="fa-solid fa-play"></i>';


    thumb.appendChild(
        play
    );


    /* INFO */

    const info =
        document.createElement(
            "div"
        );


    info.className =
        "video-info";


    const h4 =
        document.createElement(
            "h4"
        );


    h4.textContent =
        video.title ||
        "Untitled Video";


    const p =
        document.createElement(
            "p"
        );


    let views =
        Number(video.views);


    if(
        !Number.isFinite(views) ||
        views < 0
    ){

        views = 0;

    }


    p.innerHTML =
        '<i class="fa-solid fa-eye"></i> ' +
        views.toLocaleString(
            "bn-BD"
        ) +
        ' বার দেখা';


    info.appendChild(
        h4
    );


    info.appendChild(
        p
    );


    card.appendChild(
        thumb
    );


    card.appendChild(
        info
    );


    /* CLICK */

    card.addEventListener(
        "click",
        function(){

            window.location.href =
                "player.html?id=" +
                encodeURIComponent(
                    video.id
                ) +
                "&collection=" +
                encodeURIComponent(
                    video.collection
                );

        }
    );


    return card;

}



/* =========================================================
   SHARE
========================================================= */

async function sharePage(){

    const url =
        window.location.href;


    if(navigator.share){

        try{

            await navigator.share({

                title:
                    currentVideoTitle ||
                    "Rater Tara Video Apps",

                text:
                    currentVideoTitle ||
                    "ভিডিও দেখুন",

                url:url

            });

        }catch(error){}

    }else{

        copyLink();

    }

}



/* =========================================================
   COPY LINK
========================================================= */

async function copyLink(){

    try{

        await navigator.clipboard.writeText(
            window.location.href
        );


        alert(
            "ভিডিও লিংক কপি হয়েছে।"
        );


    }catch(error){

        /*
         পুরোনো browser fallback
         */

        const textarea =
            document.createElement(
                "textarea"
            );


        textarea.value =
            window.location.href;


        document.body.appendChild(
            textarea
        );


        textarea.select();


        try{

            document.execCommand(
                "copy"
            );


            alert(
                "ভিডিও লিংক কপি হয়েছে।"
            );

        }catch(e){

            alert(
                "লিংক কপি করা যায়নি।"
            );

        }


        textarea.remove();

    }

}
