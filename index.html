    <!-- =================================================

      aria-label="Profile"
      title="Profile">

<!-- Toast -->

<div
  id="toast"
  class="toast">
</div>


<script>

/* =========================================================
   RATER TARA VIDEO APPS
   HOME / INDEX PAGE

   FIREBASE PROJECT:
   love-ads-6e6f6

   COLLECTION:
   profiles

   PUBLISHED:
   status = "published"
   ========================================================= */


/* =========================================================
   FIREBASE CONFIG
   ========================================================= */


const firebaseConfig = {
  apiKey: "AIzaSyD7MR0gTPVeqMUMRTIip9Zp6oV0J7iVIaY",
 
  databaseURL: "https://rater-tara-video-apps-default-rtdb.firebaseio.com",
  projectId: "rater-tara-video-apps",
  storageBucket: "rater-tara-video-apps.firebasestorage.app",
  messagingSenderId: "622484215343",
  appId: "1:622484215343:web:90e995aa400cd103ea18da",
  measurementId: "G-3G9Z0WVSDE"
};


/* =========================================================
   FIREBASE INITIALIZE
   ========================================================= */

if (!firebase.apps.length) {

  firebase.initializeApp(
    firebaseConfig
  );

}


/* =========================================================
   FIRESTORE
   ========================================================= */

const db =
  firebase.firestore();


/* =========================================================
   DOM
   ========================================================= */

const loading =
  document.getElementById("loading");

const emptyBox =
  document.getElementById("emptyBox");

const posts =
  document.getElementById("posts");

const postList =
  document.getElementById("postList");

const postCount =
  document.getElementById("postCount");


/* =========================================================
   START
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function () {

    loadPosts();

  }
);


/* =========================================================
   LOAD PUBLISHED POSTS
   ========================================================= */

async function loadPosts() {

  loading.style.display =
    "flex";

  emptyBox.style.display =
    "none";

  posts.style.display =
    "none";

  postList.innerHTML =
    "";


  try {

    const snapshot =
      await db
        .collection("profiles")
        .where(
          "status",
          "==",
          "published"
        )
        .get();


    loading.style.display =
      "none";


    if (snapshot.empty) {

      emptyBox.style.display =
        "block";

      return;

    }


    /* =====================================================
       LOCAL SORT
       ===================================================== */

    const documents =
      snapshot.docs.sort(
        function (a, b) {

          const aData =
            a.data();

          const bData =
            b.data();


          const aTime =
            getTimestamp(
              aData.createdAt
            );


          const bTime =
            getTimestamp(
              bData.createdAt
            );


          return bTime - aTime;

        }
      );


    /* =====================================================
       RENDER
       ===================================================== */

    documents.forEach(
      function (doc) {

        renderPost(
          doc.id,
          doc.data()
        );

      }
    );


    postCount.textContent =
      toBanglaNumber(
        documents.length
      ) +
      " পোস্ট";


    posts.style.display =
      "block";


  } catch (error) {

    console.error(
      "INDEX FIRESTORE ERROR:",
      error
    );


    loading.style.display =
      "none";


    if (
      error &&
      error.code ===
      "permission-denied"
    ) {

      showErrorMessage(
        "Firestore permission denied। Firestore Rules পরীক্ষা করুন।"
      );

    } else {

      showErrorMessage(
        "পোস্ট লোড করা যাচ্ছে না। ইন্টারনেট অথবা Firebase সেটিংস পরীক্ষা করুন।"
      );

    }

  }

}


/* =========================================================
   RENDER POST
   ========================================================= */

function renderPost(
  id,
  data
) {

  const card =
    document.createElement("article");

  card.className =
    "post-card";


  /* =====================================================
     IMAGE AREA
     ===================================================== */

  const image =
    document.createElement("div");

  image.className =
    "post-image";


  const imageUrl =
    String(
      data.img ||
      data.thumbnail ||
      data.image ||
      ""
    ).trim();


  if (imageUrl) {

    const img =
      document.createElement("img");

    img.src =
      imageUrl;

    img.alt =
      escapeHtml(
        data.title ||
        data.name ||
        "Rater Tara Video"
      );


    img.loading =
      "lazy";


    img.onerror =
      function () {

        this.remove();

        const fallback =
          document.createElement("div");

        fallback.className =
          "image-fallback";

        fallback.innerHTML =
          '<i class="fa-solid fa-image"></i>';

        image.insertBefore(
          fallback,
          image.firstChild
        );

      };


    image.appendChild(
      img
    );


  } else {

    const fallback =
      document.createElement("div");

    fallback.className =
      "image-fallback";

    fallback.innerHTML =
      '<i class="fa-solid fa-image"></i>';

    image.appendChild(
      fallback
    );

  }


  /* =====================================================
     PLAY BUTTON
     ===================================================== */

  const play =
    document.createElement("div");

  play.className =
    "play-overlay";

  play.innerHTML =
    '<i class="fa-solid fa-play"></i>';

  image.appendChild(
    play
  );


  /* =====================================================
     CONTENT
     ===================================================== */

  const content =
    document.createElement("div");

  content.className =
    "post-content";


  const title =
    document.createElement("h2");

  title.className =
    "post-title";

  title.textContent =
    data.title ||
    data.name ||
    "Rater Tara Video";


  const name =
    document.createElement("div");

  name.className =
    "post-name";

  name.innerHTML =
    '<i class="fa-solid fa-user"></i> ' +
    escapeHtml(
      data.name ||
      "Rater Tara"
    );


  content.appendChild(
    title
  );


  content.appendChild(
    name
  );


  /* =====================================================
     BIO
     ===================================================== */

  if (
    data.bio &&
    String(data.bio).trim()
  ) {

    const bio =
      document.createElement("div");

    bio.className =
      "post-bio";

    bio.textContent =
      String(data.bio);

    content.appendChild(
      bio
    );

  }


  /* =====================================================
     META
     ===================================================== */

  const meta =
    document.createElement("div");

  meta.className =
    "post-meta";


  const views =
    document.createElement("span");

  views.innerHTML =
    '<i class="fa-solid fa-eye"></i> ' +
    toBanglaNumber(
      Number(data.views || 0)
    ) +
    " বার";


  meta.appendChild(
    views
  );


  const date =
    convertFirebaseDate(
      data.createdAt
    );


  if (date) {

    const dateElement =
      document.createElement("span");

    dateElement.innerHTML =
      '<i class="fa-regular fa-calendar"></i> ' +
      date.toLocaleDateString(
        "bn-BD",
        {
          year: "numeric",
          month: "short",
          day: "numeric"
        }
      );

    meta.appendChild(
      dateElement
    );

  }


  content.appendChild(
    meta
  );


  /* =====================================================
     CARD
     ===================================================== */

  card.appendChild(
    image
  );

  card.appendChild(
    content
  );


  /* =====================================================
     OPEN PLAYER
     ===================================================== */

  card.addEventListener(
    "click",
    function () {

      openPlayer(id);

    }
  );


  postList.appendChild(
    card
  );

}


/* =========================================================
   OPEN PLAYER
   ========================================================= */

function openPlayer(id) {

  if (!id) {

    showToast(
      "ভিডিও আইডি পাওয়া যায়নি"
    );

    return;

  }


  window.location.href =
    "player.html?id=" +
    encodeURIComponent(id);

}


/* =========================================================
   FIREBASE TIMESTAMP
   ========================================================= */

function getTimestamp(value) {

  try {

    if (
      value &&
      typeof value.toMillis ===
      "function"
    ) {

      return value.toMillis();

    }


    if (
      value &&
      typeof value.toDate ===
      "function"
    ) {

      return value.toDate().getTime();

    }


    if (
      typeof value ===
      "number"
    ) {

      return value;

    }


    if (
      typeof value ===
      "string"
    ) {

      const date =
        new Date(value);

      if (
        !isNaN(
          date.getTime()
        )
      ) {

        return date.getTime();

      }

    }

  } catch (error) {

    console.warn(
      "Timestamp error:",
      error
    );

  }


  return 0;

}


/* =========================================================
   FIREBASE DATE
   ========================================================= */

function convertFirebaseDate(
  value
) {

  try {

    if (
      value &&
      typeof value.toDate ===
      "function"
    ) {

      return value.toDate();

    }


    if (
      value instanceof Date
    ) {

      return value;

    }


    if (
      typeof value ===
      "number"
    ) {

      return new Date(
        value
      );

    }


    if (
      typeof value ===
      "string"
    ) {

      const date =
        new Date(value);

      if (
        !isNaN(
          date.getTime()
        )
      ) {

        return date;

      }

    }

  } catch (error) {

    console.warn(
      "Date conversion error:",
      error
    );

  }


  return null;

}


/* =========================================================
   BANGLA NUMBER
   ========================================================= */

function toBanglaNumber(
  number
) {

  const n =
    Number(number || 0);

  return String(n)
    .replace(
      /\d/g,
      function (digit) {

        return "০১২৩৪৫৬৭৮৯"[
          Number(digit)
        ];

      }
    );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  value
) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   ERROR
   ========================================================= */

function showErrorMessage(
  text
) {

  emptyBox.innerHTML = `

    <i class="fa-solid fa-circle-exclamation"></i>

    <h3>
      সমস্যা হয়েছে
    </h3>

    <p>
      ${escapeHtml(text)}
    </p>

    <button
      class="retry-btn"
      onclick="loadPosts()">

      <i class="fa-solid fa-rotate"></i>

      আবার চেষ্টা করুন

    </button>

  `;


  emptyBox.style.display =
    "block";

}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;


function showToast(
  text
) {

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    text;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      function () {

        toast.classList.remove(
          "show"
        );

      },
      2500
    );

}


/* =========================================================
   SHARE HOME
   ========================================================= */

async function shareHome() {

  const url =
    window.location.href;


  const title =
    "Rater Tara Video Apps";


  if (
    navigator.share
  ) {

    try {

      await navigator.share({
        title:
          title,

        text:
          "Rater Tara Video Apps",

        url:
          url
      });

      return;

    } catch (error) {

    }

  }


  try {

    await navigator.clipboard
      .writeText(url);

    showToast(
      "হোম পেজের লিংক কপি হয়েছে ✓"
    );

  } catch (error) {

    showToast(
      "লিংক কপি করা যায়নি"
    );

  }

}

function goBack() {

  if (
    window.history.length > 1
  ) {

    window.history.back();

  } else {

    window.location.href =
      "index.html";

  }

}
